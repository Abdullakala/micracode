services:
  micracode:
    build:
      context: .
      dockerfile: Dockerfile
    image: micracode:latest
    container_name: micracode
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "8000:8000"
    env_file:
      - .env.docker
    volumes:
      - micracode-data:/data/opener-apps
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  micracode-data:
    driver: local
