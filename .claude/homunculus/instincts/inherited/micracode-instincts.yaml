# Micracode Workflow Docker Environment Setup

## Action

Follow the docker-environment-setup workflow:
1. Edit or add Dockerfile to define runtime image.
2. Update or add .dockerignore to control Docker build context.
3. Add or update docker-compose.yml for orchestration.
4. Add or update environment example files (e.g., .env.docker.example).
5. Update README.md with instructions.
6. Optionally update supporting scripts (e.g., docker/start.sh).

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: Dockerfile, .dockerignore, docker-compose.yml

